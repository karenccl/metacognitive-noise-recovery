# Locked design constants (protocol section 1.3). All grid, seed, and
# sampler settings referenced by code/ must live here -- no script
# should hardcode these values independently. See docs/design_decisions.md
# for rationale.

seed_base: 20260923  # date this was locked (2026-09-23), used as the deterministic RNG root

grid:
  n_subjects: [20, 40]
  n_trials: [100, 200, 400]
  dprime_target: [0.75, 1.5]
  sigma_c_levels: [low, medium, high]  # values: ddm.sigma_c_values below (calibrated 2026-09-23)
  replications:
    # Revised 30 -> 20 on 2026-09-23 after measured throughput (~52
    # fits/hour at 5-way concurrency, thermal-throttled below the
    # ~124s/fit benchmark) made 30 reps a 41+ hour run. RQ1 is an
    # ordinal/monotonicity question, for which 20 reps gives bias MCSE
    # ~0.04; per-cell coverage is imprecise at any feasible rep count
    # regardless, so coverage is estimated by pooling G0 cells (MCSE
    # ~1.3%) and reported with MCSE rather than per-cell. See
    # docs/design_decisions.md for the full rationale.
    target: 20
    minimum: 15

confidence:
  k: 4

ddm:
  # Starting values for calibration (docs/design_decisions.md); v is
  # solved per dprime_target, a/t0 held fixed unless calibration shows
  # both targets cannot be reached with a shared value.
  s: 1          # diffusion coefficient (fixed, standard DDM convention)
  dt: 0.001     # Euler-Maruyama time step, seconds
  a: 1.5        # boundary separation, starting value pending calibration
  t0: 0.3       # nondecision time, seconds, starting value pending calibration
  tau: 0.3      # post-decision accumulation duration, seconds
  dprime_tolerance: 0.02  # bisection stop tolerance for calibrated empirical d'
  # Calibrated 2026-09-23 by code/01_simulate/validate_generators.R (bisection,
  # N=100,000 trials/target, common-random-numbers seed). Full detail in
  # outputs/tables/ddm_calibration.csv and docs/design_decisions.md.
  v_by_dprime_target:
    "0.75": 0.388   # empirical d' = 0.733 (target 0.75, within tolerance)
    "1.5": 0.797    # empirical d' = 1.495 (target 1.5, within tolerance)
  # sigma_c pilot (N=20,000 trials, calibrated v for d'=1.5, a=1.5, tau=0.3):
  # SD(q) = 0.5811. Chosen as the candidates whose Spearman
  # cor(confidence, correct) is closest to 3 targets spanning the observed
  # range (near-ceiling/mid/near-floor), not evenly-spaced sigma_c values --
  # see outputs/tables/sigma_c_pilot.csv for the full 12-point sweep.
  sigma_c_values:
    low: 0.291      # sigma_c/SD(q) = 0.5,  cor(q,y) = 0.883, cor(confidence,correct) = 0.287
    medium: 0.872   # sigma_c/SD(q) = 1.5,  cor(q,y) = 0.530, cor(confidence,correct) = 0.176
    high: 2.91      # sigma_c/SD(q) = 5.0,  cor(q,y) = 0.182, cor(confidence,correct) = 0.062

sampling:
  chains: 4
  warmup: 1000
  iter_sampling: 1000
  adapt_delta: 0.95
  max_treedepth: 12
  escalation:
    adapt_delta: 0.99
    max_treedepth: 14

execution:
  # Each fit uses `sampling.chains` cores (brms cores=chains, locked
  # 2026-09-23 after benchmarking showed ~2x speedup: 247s -> 124s on
  # the largest grid cell). max_concurrent_fits caps how many
  # run_one_cell.R subprocesses run_grid.R launches at once; sized for
  # a 22-logical-core machine: floor((22 - 2 headroom) / 4 cores/fit) = 5.
  # Lower this on a smaller machine. See docs/design_decisions.md for
  # the full compute-benchmark writeup and projected total runtime.
  max_concurrent_fits: 5
  # Full brmsfit objects are large; run_one_cell.R saves the full fit
  # only for rep_id <= this value (spot-checking/debugging), and a
  # compact record (draws for b_*/sd_* only, aggregated counts,
  # diagnostics, + loo/epred for G2) for every row. See
  # docs/design_decisions.md.
  keep_full_fit_max_rep_id: 2

diagnostics:
  rhat_max: 1.01
  bulk_ess_min: 400
  tail_ess_min: 400
  max_treedepth_hit_flag: true  # any transition at max_treedepth triggers refit

distributions:
  g2_alternative: gumbel_min

fitting:
  metac_absolute: true   # meta_c = c (package default; see docs/design_decisions.md)
  # Refined 2026-09-23 (code/02_fit/fit_hmetad.R): explicit
  # aggregate_metad(data, participant, K) + fit_metad(aggregate = FALSE, ...),
  # not fit_metad(aggregate = TRUE) -- avoids an ambiguity in fit_metad's
  # own "..." dots forwarding. See docs/design_decisions.md.
  aggregate: false
  hierarchical_dprime_c: true    # participant-level (1|participant) on dprime and c
  hierarchical_thresholds: false # confidence-threshold gaps pooled (not per-participant)

priors:
  log_M_production: "normal(0, 1)"        # used for all G0/G1/G2 production fits
  log_M_sensitivity: ["normal(0, 0.5)", "normal(0, 1)", "normal(0, 2)"]  # Day-4 prior sensitivity sweep
  metac2_gap: "normal(0, 1)"              # applied to all metac2_parameters(K) coefficients
