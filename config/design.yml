# Locked design constants (protocol section 1.3). All grid, seed, and
# sampler settings referenced by code/ must live here -- no script
# should hardcode these values independently.

seed_base: null  # TODO: set base seed for deterministic derivation

grid:
  n_subjects: [20, 40]
  n_trials: [100, 200, 400]
  dprime_target: [0.75, 1.5]
  sigma_c_levels: [low, medium, high]  # TODO: calibrate actual values (protocol 3.2)
  replications:
    target: 30
    minimum: 15

confidence:
  k: 4

sampling:
  chains: 4
  warmup: 1000
  iter_sampling: 1000
  adapt_delta: 0.95
  max_treedepth: null  # TODO: set and document
  escalation:
    adapt_delta: 0.99
    max_treedepth: null  # TODO: set and document

diagnostics:
  rhat_max: 1.01
  # TODO: document ESS thresholds and any additional flags

distributions:
  g2_alternative: gumbel_min

priors:
  g0: null   # TODO
  g1: null   # TODO
  g2_correct: null   # TODO
  g2_gaussian: null  # TODO
